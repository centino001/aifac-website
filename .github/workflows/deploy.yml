name: Deploy to production

on:
  push:
    branches:
      - master

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies and build assets
        run: |
          npm ci
          npm run build

      # Password auth from GitHub runners often fails on shared hosts; use a deploy key.
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_APP_DIR: ${{ secrets.SSH_APP_DIR }}
        run: |
          # Use a home-relative path. "/public_html" is system root and will fail with permission denied.
          REMOTE_DIR="${SSH_APP_DIR#/}"
          REMOTE_DIR="${REMOTE_DIR%/}"

          rsync -az --delete \
            -e "ssh -p 22" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'node_modules/' \
            --exclude 'tests/' \
            --exclude 'phpunit.xml' \
            --exclude '.phpunit.result.cache' \
            --exclude '.editorconfig' \
            --exclude 'README.md' \
            --exclude 'Homestead.json' \
            --exclude 'Homestead.yaml' \
            --exclude 'auth.json' \
            --exclude '.vscode/' \
            --exclude '.idea/' \
            --filter 'P .env' \
            --filter 'P .env.*' \
            --filter 'P storage/logs/***' \
            --filter 'P storage/framework/cache/***' \
            --filter 'P storage/framework/sessions/***' \
            --filter 'P storage/framework/views/***' \
            --filter 'P storage/app/***' \
            --filter 'P storage/pail/***' \
            ./ "${SSH_USERNAME}@${SSH_HOST}:${REMOTE_DIR}/"

      - name: Run migrations
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            APP_DIR="${{ secrets.SSH_APP_DIR }}"
            APP_DIR="${APP_DIR#/}"
            cd "$APP_DIR"
            php artisan migrate --force
