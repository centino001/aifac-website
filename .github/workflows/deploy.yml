name: Deploy to production

on:
  push:
    branches:
      - master

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Deploy via rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_APP_DIR: ${{ secrets.SSH_APP_DIR }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass rsync

          # Incremental sync over SSH (much faster than FTP after the first run).
          # Protects .env and runtime storage from --delete.
          sshpass -p "$SSH_PASSWORD" rsync -az --delete \
            -e "ssh -p 22 -o StrictHostKeyChecking=accept-new" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'node_modules/' \
            --exclude 'tests/' \
            --exclude 'phpunit.xml' \
            --exclude '.phpunit.result.cache' \
            --exclude '.editorconfig' \
            --exclude 'README.md' \
            --exclude 'Homestead.json' \
            --exclude 'Homestead.yaml' \
            --exclude 'auth.json' \
            --exclude '.vscode/' \
            --exclude '.idea/' \
            --filter 'P .env' \
            --filter 'P .env.*' \
            --filter 'P storage/logs/***' \
            --filter 'P storage/framework/cache/***' \
            --filter 'P storage/framework/sessions/***' \
            --filter 'P storage/framework/views/***' \
            --filter 'P storage/app/***' \
            --filter 'P storage/pail/***' \
            ./ "${SSH_USERNAME}@${SSH_HOST}:${SSH_APP_DIR}/"

      - name: Run migrations
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            cd "${{ secrets.SSH_APP_DIR }}"
            php artisan migrate --force
